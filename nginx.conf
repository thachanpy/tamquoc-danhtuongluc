# Tam Quốc: Vô Song — cấu hình nginx (FE tĩnh + reverse proxy BE)
#
#
# API Fastify chạy ở 127.0.0.1:3000 (pm2, file pm2.config.json), không mở ra ngoài.

upstream tamquoc_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name tamquoc.kumate.dev;

    root /home/app/game/tamquoc-danhtuongluc/apps/web/dist;
    index index.html;

    # Request API rất nhỏ (JSON); chặn body lớn
    client_max_body_size 64k;

    # Nén text (JS/CSS/SVG/JSON). Ảnh JPG/PNG và MP3 đã nén sẵn.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Header bảo mật cơ bản
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- Backend: /api/* -> Fastify ----------
    location /api/ {
        proxy_pass http://tamquoc_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Dữ liệu người chơi: không cache
        add_header Cache-Control "no-store" always;
    }

    # ---------- Frontend ----------
    # JS/CSS do Vite build có hash trong tên file -> cache lâu dài
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Ảnh tướng, khung thẻ, theme, icon, nhạc: cache 7 ngày (đổi ảnh cùng tên thì người chơi thấy sau tối đa 7 ngày)
    location ~ ^/(generals|frames|theme|icons|audio)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # index.html luôn lấy bản mới để nhận bản build mới ngay
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Game dùng hash routing (#draw, #collection…) nên mọi đường dẫn khác trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
